<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hermes</title>
  <link rel="stylesheet" href="sidepanel.css" />
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <button id="btn-sessions" class="ghost-btn session-btn" type="button" title="Sessions">
        <span id="session-title">New chat</span>
        <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M3 4.5 L6 7.5 L9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="header-actions">
        <button id="btn-new" class="icon-btn" type="button" title="New chat" aria-label="New chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
        <button id="btn-settings" class="icon-btn" type="button" title="Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Session picker dropdown -->
    <div id="session-menu" class="dropdown hidden" role="listbox" aria-label="Sessions">
      <div class="dropdown-head">
        <span>Recent sessions</span>
        <button id="btn-refresh-sessions" class="text-btn" type="button">Refresh</button>
      </div>
      <div id="session-list" class="session-list"></div>
      <div id="session-empty" class="dropdown-empty hidden">No sessions yet</div>
    </div>

    <!-- Settings panel -->
    <div id="settings-panel" class="settings hidden">
      <h2>Settings</h2>
      <label class="field">
        <span>Gateway URL</span>
        <input id="cfg-url" type="url" placeholder="http://127.0.0.1:8642" autocomplete="off" spellcheck="false" />
      </label>
      <label class="field">
        <span>API key</span>
        <input id="cfg-key" type="password" placeholder="Paste API_SERVER_KEY" autocomplete="off" spellcheck="false" />
      </label>
      <p class="hint">
        Key from <code>~/.hermes/.env</code> → <code>API_SERVER_KEY</code>
        (or <code>config.yaml</code> → <code>api_server.key</code>).
      </p>
      <label class="toggle-row" title="Coming later — no-op in v1">
        <span>Browser use <em class="soon">(soon)</em></span>
        <input id="cfg-browser-use" type="checkbox" disabled />
      </label>
      <div class="settings-actions">
        <button id="btn-test" class="secondary-btn" type="button">Test connection</button>
        <button id="btn-save" class="primary-btn" type="button">Save</button>
      </div>
      <p id="settings-status" class="status" role="status"></p>
      <button id="btn-close-settings" class="text-btn" type="button">← Back to chat</button>
    </div>

    <!-- Messages -->
    <main id="messages" class="messages" aria-live="polite">
      <div id="empty-state" class="empty-state">
        <img src="icons/icon-128.png" alt="" class="empty-logo" width="48" height="48" />
        <p>Chat with Hermes</p>
      </div>
    </main>

    <!-- Status / error strip -->
    <div id="banner" class="banner hidden" role="status"></div>

    <!-- Composer -->
    <footer class="composer-wrap">
      <form id="composer" class="composer" autocomplete="off">
        <textarea
          id="prompt"
          rows="1"
          placeholder="Message Hermes…"
          enterkeyhint="send"
        ></textarea>
        <button id="btn-send" class="send-btn" type="submit" title="Send" aria-label="Send" disabled>
          <svg class="icon-send" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 4l8 8-1.4 1.4L13 7.8V20h-2V7.8L5.4 13.4 4 12z"/>
          </svg>
          <svg class="icon-stop" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2"/>
          </svg>
        </button>
      </form>
      <div class="composer-meta">
        <span id="conn-dot" class="dot offline" title="Not connected"></span>
        <span id="conn-label">Not connected</span>
      </div>
    </footer>
  </div>
  <script src="vendor/dompurify.min.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="renderer.js"></script>
  <script src="sidepanel.js" type="module"></script>
</body>
</html>
